# ============================================================
# Pipeline 97: Full Supply Chain Security (SLSA Level 3)
# Complexity: Highly Complex
# Concepts: SLSA provenance attestation, Sigstore Cosign signing,
#           SBOM generation (CycloneDX + SPDX), attestation
#           verification, build hermetics, VEX document, Rekor
#           transparency log, supply chain policy (SLSA + OPA)
# ============================================================

trigger:
  branches:
    include: [main, release/**]
  paths:
    include: [src/**, Dockerfile]

parameters:
  - name: environment
    type: string
    default: prod
    values: [staging, prod]
  - name: targetRegistry
    type: string
    default: $(acrName).azurecr.io
  - name: generateVEX
    type: boolean
    default: true

variables:
  - group: supply-chain-vars
  - name: imageName
    value: $(targetRegistry)/$(appName)
  - name: imageRef
    value: $(imageName):$(Build.BuildId)
  - name: cosignVersion
    value: v2.2.3
  - name: syftVersion
    value: v1.0.1
  - name: grypeVersion
    value: v0.73.4

pool:
  vmImage: ubuntu-latest

stages:

  - stage: HermeticBuild
    displayName: Hermetic Build with Provenance
    jobs:
      - job: SecureBuild
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0    # Full git history for provenance

          # Record build start metadata for provenance
          - bash: |
              BUILD_START=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              GIT_COMMIT=$(git rev-parse HEAD)
              GIT_REPO=$(git remote get-url origin)
              
              echo "##vso[task.setvariable variable=buildStart]$BUILD_START"
              echo "##vso[task.setvariable variable=gitCommit]$GIT_COMMIT"
              echo "##vso[task.setvariable variable=gitRepo]$GIT_REPO"
              
              # Capture full build environment for hermetic proof
              echo "{
                \"build_start\": \"$BUILD_START\",
                \"git_commit\": \"$GIT_COMMIT\",
                \"git_repo\": \"$GIT_REPO\",
                \"builder\": \"ADO/$(Build.BuildId)\",
                \"agent\": \"$(Agent.Name)\",
                \"pipeline\": \"$(Build.DefinitionName)\"
              }" > build-env.json
              cat build-env.json
            displayName: Capture build environment

          - task: Docker@2
            displayName: Build image (no-cache, hermetic)
            inputs:
              command: build
              repository: $(imageName)
              tags: $(Build.BuildId)
              arguments: '--no-cache --pull --build-arg BUILD_ID=$(Build.BuildId) --build-arg GIT_COMMIT=$(gitCommit)'

          # Capture digest for signing
          - bash: |
              IMAGE_DIGEST=$(docker inspect "$(imageName):$(Build.BuildId)" \
                --format='{{index .RepoDigests 0}}' 2>/dev/null || true)
              if [ -z "$IMAGE_DIGEST" ]; then
                # Before push, get from local buildx
                IMAGE_DIGEST="$(imageName)@$(docker images "$(imageName):$(Build.BuildId)" --format '{{.Digest}}')"
              fi
              echo "Image digest: $IMAGE_DIGEST"
              echo "##vso[task.setvariable variable=imageDigest;isOutput=true]$IMAGE_DIGEST"
            name: captureDigest
            displayName: Capture image digest

          - task: Docker@2
            displayName: Push image to registry
            inputs:
              command: push
              repository: $(imageName)
              containerRegistry: sc-acr
              tags: $(Build.BuildId)

          # Get actual pushed digest
          - bash: |
              PUSHED_DIGEST=$(az acr repository show-tags \
                --name $(acrName) \
                --repository $(appName) \
                --detail \
                --query "[?name=='$(Build.BuildId)'].digest | [0]" \
                -o tsv 2>/dev/null || echo "")
              echo "Pushed digest: $PUSHED_DIGEST"
              echo "##vso[task.setvariable variable=pushedDigest]$PUSHED_DIGEST"
            displayName: Get pushed digest
            env:
              AZURE_DEFAULTS_ACR: $(acrName)

  - stage: GenerateSBOM
    displayName: Generate SBOM (CycloneDX + SPDX)
    dependsOn: HermeticBuild
    jobs:
      - job: SBOM
        steps:
          - bash: |
              # Install Syft
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
                | sh -s -- -b /usr/local/bin $(syftVersion)
              syft version
            displayName: Install Syft

          - bash: |
              # Generate CycloneDX SBOM
              syft "$(imageRef)" \
                --output cyclonedx-json=sbom.cyclonedx.json \
                --output cyclonedx-xml=sbom.cyclonedx.xml \
                --scope all-layers
              echo "CycloneDX SBOM generated"
            displayName: Generate CycloneDX SBOM

          - bash: |
              # Generate SPDX SBOM
              syft "$(imageRef)" \
                --output spdx-json=sbom.spdx.json \
                --output spdx-tag-value=sbom.spdx.tv \
                --scope all-layers
              echo "SPDX SBOM generated"
            displayName: Generate SPDX SBOM

          - bash: |
              # Count components
              echo "=== SBOM Summary ==="
              cat sbom.cyclonedx.json | python3 -c "
              import json, sys
              sbom = json.load(sys.stdin)
              components = sbom.get('components', [])
              print(f'Total components: {len(components)}')
              by_type = {}
              for c in components:
                  t = c.get('type', 'unknown')
                  by_type[t] = by_type.get(t, 0) + 1
              for t, cnt in sorted(by_type.items()):
                  print(f'  {t}: {cnt}')
              "
            displayName: SBOM summary

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: .
              artifactName: sbom
              patterns: 'sbom.*'

  - stage: VulnScan
    displayName: Vulnerability Scan with VEX
    dependsOn: GenerateSBOM
    jobs:
      - job: GrypeScan
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: sbom
              targetPath: $(Pipeline.Workspace)/sbom

          - bash: |
              curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
                | sh -s -- -b /usr/local/bin $(grypeVersion)
            displayName: Install Grype

          - bash: |
              grype sbom:$(Pipeline.Workspace)/sbom/sbom.spdx.json \
                --output json \
                --file vuln-report.json \
                --add-cpes-if-none \
                --fail-on critical
            displayName: Scan SBOM with Grype
            continueOnError: true

          - ${{ if eq(parameters.generateVEX, true) }}:
            - bash: |
                # Generate VEX (Vulnerability Exploitability eXchange) document
                python3 - <<'PYEOF'
                import json, datetime

                with open("vuln-report.json") as f:
                    scan = json.load(f)

                vex = {
                    "@context": "https://openvex.dev/ns",
                    "@id": f"https://$(Build.Repository.Uri)/vex/$(Build.BuildId)",
                    "author": "ADO Pipeline",
                    "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
                    "version": "1",
                    "tooling": f"grype $(grypeVersion) / ADO $(Build.BuildId)",
                    "statements": []
                }

                matches = scan.get("matches", [])
                for vuln in matches:
                    cve = vuln.get("vulnerability", {}).get("id", "")
                    if cve:
                        vex["statements"].append({
                            "vulnerability": {"@id": f"https://nvd.nist.gov/vuln/detail/{cve}", "name": cve},
                            "status": "under_investigation",
                            "justification": "Component lifecycle reviewed"
                        })

                with open("vex-document.json", "w") as f:
                    json.dump(vex, f, indent=2)
                print(f"VEX document created with {len(vex['statements'])} statements")
                PYEOF
              displayName: Generate VEX document

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: .
              artifactName: security-reports
              patterns: 'vuln-report.json,vex-document.json'

  - stage: SignAndAttest
    displayName: Sign Image & Attest Provenance (SLSA)
    dependsOn:
      - VulnScan
      - GenerateSBOM
    jobs:
      - job: SignAttest
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              pattern: '**'
              targetPath: $(Pipeline.Workspace)/artifacts

          - bash: |
              # Install Cosign
              curl -sSfL "https://github.com/sigstore/cosign/releases/download/$(cosignVersion)/cosign-linux-amd64" \
                -o /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign
              cosign version
            displayName: Install Cosign

          # Sign image with Azure Key Vault key
          - bash: |
              cosign sign \
                --key "azurekms://$(keyVaultName).vault.azure.net/keys/cosign-key" \
                --tlog-upload=true \
                --yes \
                "$(imageRef)"
              echo "Image signed with KV key"
            displayName: Sign image with Cosign
            env:
              AZURE_CLIENT_ID: $(spClientId)
              AZURE_CLIENT_SECRET: $(spClientSecret)
              AZURE_TENANT_ID: $(tenantId)

          # Attach SBOM as attestation
          - bash: |
              cosign attest \
                --key "azurekms://$(keyVaultName).vault.azure.net/keys/cosign-key" \
                --predicate "$(Pipeline.Workspace)/artifacts/sbom/sbom.cyclonedx.json" \
                --type cyclonedx \
                --tlog-upload=true \
                --yes \
                "$(imageRef)"
              echo "SBOM attestation attached"
            displayName: Attest SBOM (CycloneDX)
            env:
              AZURE_CLIENT_ID: $(spClientId)
              AZURE_CLIENT_SECRET: $(spClientSecret)
              AZURE_TENANT_ID: $(tenantId)

          # SLSA provenance
          - bash: |
              cat > provenance.json <<EOF
              {
                "_type": "https://in-toto.io/Statement/v0.1",
                "predicateType": "https://slsa.dev/provenance/v0.2",
                "subject": [{
                  "name": "$(imageRef)",
                  "digest": {"sha256": "$(Build.BuildId)"}
                }],
                "predicate": {
                  "builder": {"id": "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/$(Build.DefinitionId)"},
                  "buildType": "https://dev.azure.com/types/pipeline@v1",
                  "invocation": {
                    "configSource": {
                      "uri": "$(Build.Repository.Uri)",
                      "digest": {"sha1": "$(Build.SourceVersion)"}
                    }
                  },
                  "metadata": {
                    "buildStartedOn": "$(buildStart)",
                    "buildFinishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "completeness": {"parameters": true, "environment": false, "materials": true},
                    "reproducible": false
                  }
                }
              }
              EOF

              cosign attest \
                --key "azurekms://$(keyVaultName).vault.azure.net/keys/cosign-key" \
                --predicate provenance.json \
                --type slsaprovenance \
                --tlog-upload=true \
                --yes \
                "$(imageRef)"
              echo "SLSA provenance attestation complete"
            displayName: Attest SLSA provenance
            env:
              AZURE_CLIENT_ID: $(spClientId)
              AZURE_CLIENT_SECRET: $(spClientSecret)
              AZURE_TENANT_ID: $(tenantId)

          # Verify the full chain
          - bash: |
              cosign verify \
                --key "azurekms://$(keyVaultName).vault.azure.net/keys/cosign-key" \
                "$(imageRef)"
              echo "Cosign verification passed"
            displayName: Verify signature chain
            env:
              AZURE_CLIENT_ID: $(spClientId)
              AZURE_CLIENT_SECRET: $(spClientSecret)
              AZURE_TENANT_ID: $(tenantId)

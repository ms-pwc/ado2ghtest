# ============================================================
# Pipeline 99: Enterprise Compliance & Audit Reporting
# Complexity: Highly Complex
# Concepts: SOC 2 / ISO 27001 evidence collection, automated
#           compliance checks, Azure Policy compliance export,
#           RBAC audit, encryption-at-rest validation,
#           log retention checks, patch compliance, report
#           generation, cloud custodian integration
# ============================================================

trigger: none   # manual or quarterly schedule only

schedules:
  - cron: '0 4 1 1,4,7,10 *'   # Quarterly: Jan/Apr/Jul/Oct 1st at 04:00
    displayName: Quarterly compliance audit
    branches:
      include: [main]
    always: true

parameters:
  - name: auditScope
    type: object
    default:
      - subscriptionId: $(prodSubscriptionId)
        name: production
      - subscriptionId: $(drSubscriptionId)
        name: disaster-recovery
  - name: frameworks
    type: object
    default:
      - SOC2
      - ISO27001
      - NIST
  - name: reportFormat
    type: string
    default: HTML
    values: [HTML, JSON, PDF]
  - name: reportRecipients
    type: string
    default: compliance@mycompany.com

variables:
  - group: compliance-audit-vars
  - name: auditDate
    value: $(date +%Y-%m-%d)
  - name: auditId
    value: AUDIT-$(Build.BuildId)-$(date +%Y%m%d)

pool:
  vmImage: ubuntu-latest

stages:

  - stage: AccessAndEncryptionAudit
    displayName: Access Control & Encryption Audit
    jobs:
      - job: AuditAccess
        steps:
          - task: AzureCLI@2
            displayName: RBAC audit
            inputs:
              azureSubscription: sc-azure-audit
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                mkdir -p audit-results

                ${{ each sub in parameters.auditScope }}:
                  echo "=== RBAC Audit: ${{ sub.name }} ==="

                  # Users with Owner/Contributor at subscription level
                  az role assignment list \
                    --scope "/subscriptions/${{ sub.subscriptionId }}" \
                    --include-classic-administrators \
                    --query "[].{principal:principalName,role:roleDefinitionName,type:principalType}" \
                    -o json > audit-results/rbac-${{ sub.name }}.json

                  echo "Privileged assignments for ${{ sub.name }}:"
                  jq -r '.[] | select(.role=="Owner" or .role=="Contributor") | "\(.principal) [\(.type)]"' \
                    audit-results/rbac-${{ sub.name }}.json

          - task: AzureCLI@2
            displayName: Encryption audit
            inputs:
              azureSubscription: sc-azure-audit
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Storage Accounts – Encryption checks ==="
                az storage account list \
                  --query "[].{name:name,rg:resourceGroup,infraEncryption:extendedProperties.requireInfrastructureEncryption,keySource:encryption.keySource,tls:minimumTlsVersion}" \
                  -o table | tee audit-results/storage-encryption.txt

                echo ""
                echo "=== SQL Databases – TDE status ==="
                for server in $(az sql server list --query "[].name" -o tsv); do
                  for db in $(az sql db list --server $server --query "[].name" -o tsv 2>/dev/null); do
                    STATUS=$(az sql db tde show --server $server --database $db \
                      --query status -o tsv 2>/dev/null || echo "N/A")
                    echo "$server/$db: TDE=$STATUS"
                  done
                done | tee audit-results/sql-tde.txt

                echo ""
                echo "=== Key Vaults – soft delete & purge protection ==="
                az keyvault list \
                  --query "[].{name:name,rg:resourceGroup,sd:properties.enableSoftDelete,pp:properties.enablePurgeProtection}" \
                  -o table | tee audit-results/keyvault-settings.txt

  - stage: LoggingAndMonitoringAudit
    displayName: Logging & Monitoring Compliance
    jobs:
      - job: LogAudit
        steps:
          - task: AzureCLI@2
            displayName: Diagnostic logs audit
            inputs:
              azureSubscription: sc-azure-audit
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Resources without diagnostic settings ==="
                az monitor diagnostic-settings list \
                  --resource "/subscriptions/$(prodSubscriptionId)" \
                  --query "[?settings==\`[]\`].resourceUri" \
                  -o tsv 2>/dev/null | head -20 | tee audit-results/no-diag-settings.txt || true

                echo ""
                echo "=== Log Analytics workspace retention ==="
                az monitor log-analytics workspace list \
                  --query "[].{name:name,rg:resourceGroup,retention:retentionInDays,sku:sku.name}" \
                  -o table | tee audit-results/log-analytics.txt

                # Compliance: require ≥ 90 days retention
                az monitor log-analytics workspace list \
                  --query "[?retentionInDays<\`90\`].{name:name,retention:retentionInDays}" \
                  -o json | python3 -c "
                import json, sys
                ws = json.load(sys.stdin)
                if ws:
                    print(f'WARNING: {len(ws)} workspace(s) with retention < 90 days:')
                    for w in ws:
                        print(f'  {w[\"name\"]}: {w[\"retention\"]} days')
                "

  - stage: NetworkSecurityAudit
    displayName: Network Security Compliance
    jobs:
      - job: NetworkAudit
        steps:
          - task: AzureCLI@2
            displayName: DDoS protection audit
            inputs:
              azureSubscription: sc-azure-audit
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Virtual Networks – DDoS protection ==="
                az network vnet list \
                  --query "[].{name:name,rg:resourceGroup,ddos:enableDdosProtection}" \
                  -o table | tee audit-results/vnet-ddos.txt

                # Warn if any production VNet lacks DDoS Standard
                NO_DDOS=$(az network vnet list \
                  --query "length([?!enableDdosProtection])" -o tsv)
                if [ "$NO_DDOS" -gt "0" ]; then
                  echo "##vso[task.logissue type=warning]$NO_DDOS VNet(s) without DDoS protection"
                fi

          - task: AzureCLI@2
            displayName: WAF coverage audit
            inputs:
              azureSubscription: sc-azure-audit
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Application Gateways – WAF mode ==="
                az network application-gateway list \
                  --query "[].{name:name,rg:resourceGroup,wafMode:webApplicationFirewallConfiguration.firewallMode,tier:sku.tier}" \
                  -o table | tee audit-results/ag-waf.txt

                NOT_PREVENTION=$(az network application-gateway list \
                  --query "[?webApplicationFirewallConfiguration.firewallMode!='Prevention'].name" \
                  -o tsv | wc -l)
                if [ "$NOT_PREVENTION" -gt "0" ]; then
                  echo "##vso[task.logissue type=error]$NOT_PREVENTION App Gateway(s) WAF not in Prevention mode!"
                fi

  - stage: PatchComplianceAudit
    displayName: Patch & Vulnerability Compliance
    jobs:
      - job: PatchAudit
        steps:
          - task: AzureCLI@2
            displayName: VM patch compliance
            inputs:
              azureSubscription: sc-azure-audit
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== VM Patch assessment ==="
                az vm list \
                  --query "[].{name:name,rg:resourceGroup,os:storageProfile.osDisk.osType}" \
                  -o table | tee audit-results/vm-list.txt

                # Trigger patch assessment
                for VM in $(az vm list --query "[].{n:name,r:resourceGroup}" -o json \
                  | jq -r '.[] | "\(.r)/\(.n)"'); do
                  RG=$(echo $VM | cut -d/ -f1)
                  VMNAME=$(echo $VM | cut -d/ -f2)
                  az vm assess-patches --resource-group $RG --name $VMNAME 2>/dev/null | \
                    jq '{vm: "'"$VMNAME"'", critical: .criticalAndSecurityPatchCount, other: .otherPatchCount}' || true
                done | tee audit-results/patch-assessment.txt

  - stage: GenerateComplianceReport
    displayName: Generate Compliance Report
    dependsOn:
      - AccessAndEncryptionAudit
      - LoggingAndMonitoringAudit
      - NetworkSecurityAudit
      - PatchComplianceAudit
    condition: always()
    jobs:
      - job: BuildReport
        steps:
          - bash: pip install jinja2 pdfkit markdown2
            displayName: Install report tools

          - bash: |
              cat <<REPORTEOF > compliance-report.md
              # Enterprise Compliance Report
              **Audit ID:** $(auditId)
              **Date:** $(date -u)
              **Frameworks:** ${{ join(', ', parameters.frameworks) }}
              **Scope:** ${{ join(', ', parameters.auditScope.*.name) }}
              **Prepared by:** ADO Pipeline $(Build.BuildId)

              ---

              ## Executive Summary
              This report documents the automated compliance assessment results.

              ## Findings by Control Domain

              ### AC – Access Control
              - Privileged role assignments reviewed (see rbac-*.json)
              - Owner/Contributor at subscription scope flagged for review

              ### AU – Audit & Accountability
              - Log retention compliance checked (minimum 90 days)
              - Diagnostic settings coverage assessed

              ### SC – System & Communications Protection
              - TLS minimum version: TLS 1.2 enforced on Storage Accounts
              - TDE enabled on SQL databases
              - Key Vault purge protection reviewed
              - DDoS Standard coverage assessed
              - WAF Prevention mode validated

              ### SI – System & Information Integrity
              - VM patch compliance assessed via Azure Update Manager

              ## Recommendations
              1. Enforce DDoS Standard on all production VNets
              2. Ensure all App Gateways run WAF in Prevention mode
              3. Set Log Analytics retention to minimum 90 days
              4. Review and rotate any expiring service principal credentials

              ---
              *Generated automatically. Manual review required for final attestation.*
              REPORTEOF

              cat compliance-report.md
            displayName: Generate report

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: .
              artifactName: compliance-report
              patterns: 'compliance-report.md,audit-results/**'

          - bash: |
              # Email report via Logic App
              curl -sf -X POST "$(reportLogicAppUrl)" \
                -H "Content-Type: application/json" \
                -d "{
                  \"to\": \"${{ parameters.reportRecipients }}\",
                  \"subject\": \"${{ join(', ', parameters.frameworks) }} Compliance Report – $(auditDate)\",
                  \"auditId\": \"$(auditId)\",
                  \"buildId\": \"$(Build.BuildId)\"
                }" || true
            displayName: Email compliance report

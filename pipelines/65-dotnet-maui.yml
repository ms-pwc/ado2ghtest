# ============================================================
# Pipeline 65: .NET MAUI – Cross-Platform Mobile/Desktop
# Complexity: Complex
# Concepts: MAUI multi-target (iOS/Android/Windows/macOS),
#           platform-specific signing, matrix publish,
#           .msix, .apk, .ipa packaging
# ============================================================

trigger:
  branches:
    include: [main, release/*]
  paths:
    include: [src/MyApp.Maui/**]

parameters:
  - name: platforms
    type: object
    default:
      - name: Android
        rid: android
        artifactName: android-apk
      - name: Windows
        rid: windows10.0.19041
        artifactName: windows-msix

variables:
  dotnetVersion: '8.x'
  projectPath: src/MyApp.Maui/MyApp.Maui.csproj
  buildConfiguration: Release

stages:

  - stage: BuildAll
    displayName: Build All Platforms
    jobs:

      # Android Build (Ubuntu)
      - job: BuildAndroid
        displayName: Build Android APK
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: UseDotNet@2
            displayName: Install .NET $(dotnetVersion)
            inputs:
              version: $(dotnetVersion)

          - script: dotnet workload install android
            displayName: Install Android workload

          - script: |
              dotnet publish $(projectPath) \
                -f net8.0-android \
                -c $(buildConfiguration) \
                -p:AndroidSigningKeyStore=$(ANDROID_KEYSTORE_PATH) \
                -p:AndroidSigningKeyAlias=$(ANDROID_KEY_ALIAS) \
                -p:AndroidSigningKeyPass=$(ANDROID_KEY_PASS) \
                -p:AndroidSigningStorePass=$(ANDROID_STORE_PASS) \
                -o $(Build.ArtifactStagingDirectory)/android
            displayName: Publish Android
            continueOnError: true

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/android
              artifact: android-apk

      # Windows Build (Windows agent)
      - job: BuildWindows
        displayName: Build Windows MSIX
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              version: $(dotnetVersion)

          - script: dotnet workload install maccatalyst ios android windows
            displayName: Install MAUI workloads

          - task: PowerShell@2
            displayName: Publish Windows
            inputs:
              targetType: inline
              script: |
                dotnet publish $(projectPath) `
                  -f net8.0-windows10.0.19041.0 `
                  -c $(buildConfiguration) `
                  /p:WindowsPackageType=MSIX `
                  /p:AppxPackageDir="$(Build.ArtifactStagingDirectory)/windows/" `
                  /p:GenerateAppxPackageOnBuild=true

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/windows
              artifact: windows-msix

      # macOS Build
      - job: BuildMacOS
        displayName: Build macOS .app
        pool:
          vmImage: macOS-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              version: $(dotnetVersion)

          - script: dotnet workload install maccatalyst
            displayName: Install macOS workload

          - script: |
              dotnet publish $(projectPath) \
                -f net8.0-maccatalyst \
                -c $(buildConfiguration) \
                -o $(Build.ArtifactStagingDirectory)/macos
            displayName: Publish macOS
            continueOnError: true

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/macos
              artifact: macos-app

  - stage: DistributeAll
    displayName: Distribute to Stores
    dependsOn: BuildAll
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
    jobs:
      - deployment: PublishAndroid
        displayName: Publish to Google Play (internal track)
        environment: google-play
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: android-apk
                - bash: echo "Uploading APK to Google Play internal track..."
                  displayName: Upload to Play Store

      - deployment: PublishWindows
        displayName: Publish to Microsoft Store
        environment: microsoft-store
        pool:
          vmImage: windows-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: windows-msix
                - script: echo "Submitting MSIX to Microsoft Store..."
                  displayName: Submit to MS Store

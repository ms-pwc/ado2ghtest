# ============================================================
# Pipeline 22: Python – Full CI with Tox & Coverage
# Complexity: Simple-Medium
# Concepts: UsePythonVersion, pip, tox, pytest, coverage.xml,
#           Flake8, bandit (security), wheel publish
# ============================================================

trigger:
  branches:
    include: [main, develop]
  paths:
    include: [src/**, tests/**, requirements*.txt, setup.py, pyproject.toml]

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.11'
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: Use Python $(pythonVersion)
    inputs:
      versionSpec: $(pythonVersion)
      addToPath: true

  # Cache pip downloads
  - task: Cache@2
    displayName: Cache pip
    inputs:
      key: 'pip | "$(Agent.OS)" | requirements*.txt'
      restoreKeys: pip | "$(Agent.OS)"
      path: $(PIP_CACHE_DIR)

  - script: |
      python -m pip install --upgrade pip wheel setuptools
      pip install -r requirements.txt
      pip install -r requirements-dev.txt
    displayName: Install dependencies

  # Code formatting check
  - script: |
      pip install black
      black --check src/ tests/
    displayName: Black format check
    continueOnError: true

  # Linting
  - script: |
      pip install flake8
      flake8 src/ tests/ --max-line-length=120 --statistics
    displayName: Flake8 linting
    continueOnError: true

  # Type checking
  - script: |
      pip install mypy
      mypy src/ --ignore-missing-imports
    displayName: MyPy type check
    continueOnError: true

  # Security scan
  - script: |
      pip install bandit
      bandit -r src/ -f json -o $(Agent.TempDirectory)/bandit-report.json || true
      bandit -r src/ -ll
    displayName: Bandit security scan
    continueOnError: true

  # Unit tests with coverage
  - script: |
      pip install pytest pytest-cov
      pytest tests/ \
        --junitxml=$(Agent.TempDirectory)/test-results.xml \
        --cov=src \
        --cov-report=xml:$(Agent.TempDirectory)/coverage.xml \
        --cov-report=html:$(Agent.TempDirectory)/htmlcov \
        -v
    displayName: pytest + coverage

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(Agent.TempDirectory)/test-results.xml

  - task: PublishCodeCoverageResults@1
    displayName: Publish coverage
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: $(Agent.TempDirectory)/coverage.xml

  # Build wheel
  - script: python setup.py bdist_wheel
    displayName: Build wheel
    continueOnError: true

  - task: PublishPipelineArtifact@1
    displayName: Publish wheel artifact
    inputs:
      targetPath: dist/
      artifact: python-wheel

# ============================================================
# Pipeline 34: Database Migrations – EF Core & Flyway
# Complexity: Medium
# Concepts: SQL Server service container, EF Core migration,
#           Flyway migrations, SqlAzureDacpacDeployment,
#           migration rollback strategy
# ============================================================

trigger:
  branches:
    include: [main]
  paths:
    include: [src/**/Migrations/**, db/**]

variables:
  buildConfiguration: Release
  azureServiceConnection: sc-azure-prod
  sqlServerName: myapp-sql.database.windows.net
  databaseName: myapp_db
  efProject: src/MyApp.Data/MyApp.Data.csproj

pool:
  vmImage: ubuntu-latest

stages:

  - stage: MigrateLocal
    displayName: Test migrations against SQL Server container
    jobs:
      - job: EFCoreTest
        displayName: EF Core migration (container DB)
        services:
          sqlserver:
            image: mcr.microsoft.com/mssql/server:2022-latest
            env:
              ACCEPT_EULA: Y
              SA_PASSWORD: MyStrong!Passw0rd
              MSSQL_PID: Developer
            ports:
              - 1433:1433
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              version: '8.x'

          # Install EF Core tools
          - script: dotnet tool install --global dotnet-ef
            displayName: Install dotnet-ef tool

          # Wait for SQL Server
          - bash: |
              for i in $(seq 1 30); do
                /opt/mssql-tools/bin/sqlcmd \
                  -S localhost -U sa -P 'MyStrong!Passw0rd' \
                  -Q "SELECT 1" 2>/dev/null && break || sleep 2
              done
              echo "SQL Server ready"
            displayName: Wait for SQL Server

          # Apply EF Core migrations
          - script: |
              dotnet ef database update \
                --project $(efProject) \
                --connection "Server=localhost;Database=myapp_test;User Id=sa;Password=MyStrong!Passw0rd;TrustServerCertificate=True"
            displayName: Apply EF Core migrations

          # Verify migration history
          - script: |
              dotnet ef migrations list \
                --project $(efProject) \
                --connection "Server=localhost;Database=myapp_test;User Id=sa;Password=MyStrong!Passw0rd;TrustServerCertificate=True"
            displayName: List applied migrations

  - stage: MigrateFlyway
    displayName: Flyway SQL migrations (container)
    dependsOn: []
    jobs:
      - job: FlywayMigrate
        services:
          postgres:
            image: postgres:15
            env:
              POSTGRES_DB: appdb
              POSTGRES_USER: appuser
              POSTGRES_PASSWORD: apppass
            ports:
              - 5432:5432
        steps:
          - checkout: self

          # Install Flyway CLI
          - bash: |
              wget -q https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.8.1/flyway-commandline-10.8.1-linux-x64.tar.gz
              tar -xzf flyway-commandline-10.8.1-linux-x64.tar.gz
              sudo ln -sf $(pwd)/flyway-10.8.1/flyway /usr/local/bin/flyway
              flyway -v
            displayName: Install Flyway

          # Run Flyway migrate
          - bash: |
              flyway \
                -url="jdbc:postgresql://localhost:5432/appdb" \
                -user=appuser \
                -password=apppass \
                -locations="filesystem:db/migrations" \
                migrate
            displayName: Flyway migrate

          # Flyway info (show migration state)
          - bash: |
              flyway \
                -url="jdbc:postgresql://localhost:5432/appdb" \
                -user=appuser \
                -password=apppass \
                -locations="filesystem:db/migrations" \
                info
            displayName: Flyway info

  - stage: MigrateProd
    displayName: Apply migrations to production Azure SQL
    dependsOn:
      - MigrateLocal
      - MigrateFlyway
    condition: and(succeeded('MigrateLocal'), eq(variables['Build.SourceBranchName'], 'main'))
    jobs:
      - deployment: ProdMigrate
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UseDotNet@2
                  inputs:
                    version: '8.x'

                - script: dotnet tool install --global dotnet-ef
                  displayName: Install dotnet-ef

                - task: AzureCLI@2
                  displayName: Apply EF migrations to Azure SQL
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      # Get connection string from Key Vault
                      CONN=$(az keyvault secret show \
                        --vault-name myapp-kv \
                        --name SqlConnectionString \
                        --query value -o tsv)
                      
                      dotnet ef database update \
                        --project $(efProject) \
                        --configuration $(buildConfiguration) \
                        --connection "$CONN"
                      
                      echo "Production database migrated successfully"

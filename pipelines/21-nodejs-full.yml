# ============================================================
# Pipeline 21: Node.js – Full Build, Test, Lint, Audit
# Complexity: Simple-Medium
# Concepts: NodeTool, npm scripts, eslint, jest coverage,
#           PublishCodeCoverageResults, npm audit, .npmrc
# ============================================================

trigger:
  branches:
    include: [main, develop]
  paths:
    include: [src/**, package*.json]

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  CI: 'true'

steps:
  - checkout: self

  - task: NodeTool@0
    displayName: Install Node.js $(nodeVersion)
    inputs:
      versionSpec: $(nodeVersion)

  - script: |
      node --version
      npm --version
    displayName: Verify Node.js version

  # Use npm ci (clean install, faster & reproducible in CI)
  - script: npm ci
    displayName: npm ci (clean install)

  # Lint
  - script: npm run lint -- --format stylish
    displayName: ESLint
    continueOnError: false

  # Build / transpile
  - script: npm run build
    displayName: Build (transpile TypeScript / bundle)

  # Unit tests with coverage
  - script: npm test -- --coverage --coverageReporters=cobertura --coverageDirectory=$(Agent.TempDirectory)/coverage
    displayName: Jest unit tests + coverage

  # Publish test results
  - task: PublishTestResults@2
    displayName: Publish Jest results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/jest-results.xml'

  # Publish code coverage
  - task: PublishCodeCoverageResults@1
    displayName: Publish code coverage
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: $(Agent.TempDirectory)/coverage/cobertura-coverage.xml
      reportDirectory: $(Agent.TempDirectory)/coverage

  # Security audit (non-blocking in CI)
  - script: npm audit --audit-level=high
    displayName: npm audit (security)
    continueOnError: true

  # Publish dist artifact
  - task: CopyFiles@2
    displayName: Stage dist files
    inputs:
      SourceFolder: dist
      TargetFolder: $(Build.ArtifactStagingDirectory)

  - task: PublishPipelineArtifact@1
    displayName: Publish dist artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: node-dist

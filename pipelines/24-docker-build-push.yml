# ============================================================
# Pipeline 24: Docker – Build, Tag, Push to ACR
# Complexity: Medium
# Concepts: Docker@2 task, buildAndPush, tag strategies,
#           container registry service connection, Dockerfile,
#           build args, image metadata
# ============================================================

trigger:
  branches:
    include: [main, release/*]
  paths:
    include: [Dockerfile, src/**]

pr:
  branches:
    include: [main]

variables:
  imageRepository: myapp
  containerRegistry: myacr.azurecr.io
  dockerRegistryServiceConnection: sc-myacr
  dockerfilePath: Dockerfile
  # Build a tag from branch + build ID
  imageTag: $(Build.SourceBranchName)-$(Build.BuildId)
  # Latest tag only for main
  ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    extraTag: latest
  ${{ else }}:
    extraTag: $(Build.SourceBranchName)

pool:
  vmImage: ubuntu-latest

stages:

  - stage: BuildAndPush
    displayName: Build & Push Docker Image
    jobs:
      - job: DockerBuild
        displayName: Docker build and push
        steps:
          - checkout: self

          # Build-only on PRs (don't push)
          - task: Docker@2
            displayName: Build image (PR validation)
            condition: eq(variables['Build.Reason'], 'PullRequest')
            inputs:
              command: build
              dockerfile: $(dockerfilePath)
              buildContext: .
              repository: $(containerRegistry)/$(imageRepository)
              tags: pr-$(System.PullRequest.PullRequestId)
              arguments: |
                --build-arg BUILD_ID=$(Build.BuildId)
                --build-arg BUILD_DATE=$(Build.QueueTime)
                --label org.opencontainers.image.revision=$(Build.SourceVersion)

          # Build + Push on CI (non-PR)
          - task: Docker@2
            displayName: Build and push image
            condition: ne(variables['Build.Reason'], 'PullRequest')
            inputs:
              command: buildAndPush
              dockerfile: $(dockerfilePath)
              buildContext: .
              repository: $(containerRegistry)/$(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(imageTag)
                $(extraTag)
              arguments: |
                --build-arg BUILD_ID=$(Build.BuildId)

          # Export image digest for downstream stages
          - bash: |
              DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
                $(containerRegistry)/$(imageRepository):$(imageTag) 2>/dev/null || echo "N/A")
              echo "##vso[task.setvariable variable=imageDigest;isOutput=true]$DIGEST"
              echo "Image digest: $DIGEST"
            name: imageInfo
            displayName: Export image digest
            condition: ne(variables['Build.Reason'], 'PullRequest')

          # Scan image for vulnerabilities (Trivy – simple inline)
          - bash: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image \
                --exit-code 0 \
                --severity HIGH,CRITICAL \
                --format table \
                $(containerRegistry)/$(imageRepository):$(imageTag) \
                || true
            displayName: Trivy vulnerability scan
            condition: ne(variables['Build.Reason'], 'PullRequest')
            continueOnError: true

  - stage: PublishMetadata
    displayName: Publish image metadata
    dependsOn: BuildAndPush
    condition: |
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: Metadata
        pool:
          vmImage: ubuntu-latest
        variables:
          imageDigest: $[ stageDependencies.BuildAndPush.DockerBuild.outputs['imageInfo.imageDigest'] ]
        steps:
          - bash: |
              echo "Image : $(containerRegistry)/$(imageRepository):$(imageTag)"
              echo "Digest: $(imageDigest)"
            displayName: Print image metadata

# ============================================================
# Pipeline 36: Load & Performance Testing – k6 & JMeter
# Complexity: Medium
# Concepts: k6 load test, JMeter, performance thresholds,
#           PublishTestResults, pass/fail gates on perf metrics
# ============================================================

trigger: none          # run on-demand or on schedule

schedules:
  - cron: '0 1 * * 1'   # every Monday 01:00 UTC
    displayName: Weekly performance test
    branches:
      include: [main]
    always: true

variables:
  targetUrl: https://myapp-staging.azurewebsites.net
  k6Version: 0.49.0
  virtualUsers: 50
  durationSeconds: 60

pool:
  vmImage: ubuntu-latest

stages:

  - stage: K6LoadTest
    displayName: k6 Load Test
    jobs:
      - job: K6
        timeoutInMinutes: 30
        steps:
          - checkout: self

          # Install k6
          - bash: |
              curl -s https://github.com/grafana/k6/releases/download/v$(k6Version)/k6-v$(k6Version)-linux-amd64.tar.gz \
                -L | tar xz --strip-components=1
              sudo mv k6 /usr/local/bin/k6
              k6 version
            displayName: Install k6

          # Create k6 test script if not committed
          - bash: |
              cat > /tmp/load-test.js <<'SCRIPT'
              import http from 'k6/http';
              import { check, sleep } from 'k6';
              import { Rate, Trend } from 'k6/metrics';

              const errorRate = new Rate('errors');
              const responseTime = new Trend('response_time');

              export const options = {
                vus: __ENV.VUS || 10,
                duration: `${__ENV.DURATION || 30}s`,
                thresholds: {
                  http_req_duration: ['p(95)<500', 'p(99)<1000'],
                  http_req_failed:   ['rate<0.01'],
                  errors:            ['rate<0.05'],
                },
              };

              export default function () {
                const res = http.get(__ENV.TARGET_URL + '/health');
                check(res, {
                  'status is 200': (r) => r.status === 200,
                  'response time < 500ms': (r) => r.timings.duration < 500,
                });
                errorRate.add(res.status !== 200);
                responseTime.add(res.timings.duration);
                sleep(1);
              }
              SCRIPT
            displayName: Create k6 script

          # Run k6 and output JUnit XML
          - bash: |
              k6 run \
                --vus $(virtualUsers) \
                --duration $(durationSeconds)s \
                --out json=$(Agent.TempDirectory)/k6-results.json \
                -e TARGET_URL=$(targetUrl) \
                -e VUS=$(virtualUsers) \
                -e DURATION=$(durationSeconds) \
                /tmp/load-test.js \
                2>&1 | tee $(Agent.TempDirectory)/k6-output.txt
            displayName: Run k6 load test

          # Convert k6 output to JUnit
          - bash: |
              pip install k6-to-junit 2>/dev/null || true
              # Simple summary extraction
              echo "k6 load test completed. Check artifacts for results."
              cat $(Agent.TempDirectory)/k6-output.txt | grep -E "http_req|checks|errors" || true
            displayName: Parse k6 results

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Agent.TempDirectory)/k6-results.json
              artifact: k6-results
            condition: always()

  - stage: JMeterTest
    displayName: JMeter Stress Test
    dependsOn: []          # run in parallel with k6
    jobs:
      - job: JMeter
        timeoutInMinutes: 30
        steps:
          - checkout: self

          # Install JMeter
          - bash: |
              JMETER_VERSION=5.6.3
              wget -q "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
              tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
              echo "##vso[task.prependpath]$(pwd)/apache-jmeter-${JMETER_VERSION}/bin"
            displayName: Install JMeter

          # Create JMX test plan
          - bash: |
              mkdir -p $(Agent.TempDirectory)/jmeter
              cat > $(Agent.TempDirectory)/jmeter/test.jmx <<'JMX'
              <?xml version="1.0" encoding="UTF-8"?>
              <jmeterTestPlan version="1.2" properties="5.0">
                <hashTree>
                  <TestPlan testname="Basic Load Test" enabled="true">
                    <hashTree>
                      <ThreadGroup testname="Users" enabled="true">
                        <intProp name="ThreadGroup.num_threads">20</intProp>
                        <intProp name="ThreadGroup.ramp_time">10</intProp>
                        <intProp name="ThreadGroup.duration">30</intProp>
                        <boolProp name="ThreadGroup.scheduler">true</boolProp>
                        <hashTree>
                          <HTTPSamplerProxy testname="Health Check" enabled="true">
                            <stringProp name="HTTPSampler.domain">myapp-staging.azurewebsites.net</stringProp>
                            <stringProp name="HTTPSampler.path">/health</stringProp>
                            <stringProp name="HTTPSampler.method">GET</stringProp>
                            <hashTree/>
                          </HTTPSamplerProxy>
                        </hashTree>
                      </ThreadGroup>
                    </hashTree>
                  </TestPlan>
                </hashTree>
              </jmeterTestPlan>
              JMX
            displayName: Generate JMX plan

          - bash: |
              jmeter -n \
                -t $(Agent.TempDirectory)/jmeter/test.jmx \
                -l $(Agent.TempDirectory)/jmeter/results.jtl \
                -e -o $(Agent.TempDirectory)/jmeter/report \
                -Jjmeter.reportgenerator.overall_granularity=1000 \
                || true
            displayName: Run JMeter test

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Agent.TempDirectory)/jmeter/report
              artifact: jmeter-report
            condition: always()

# ============================================================
# Pipeline 32: Kubernetes (AKS) – Deploy with kubectl
# Complexity: Medium
# Concepts: KubernetesManifest task, kubectl task,
#           imagePullSecrets, rollout status, namespace,
#           Kubernetes environment resource
# ============================================================

trigger:
  branches:
    include: [main]

variables:
  containerRegistry: myacr.azurecr.io
  imageRepository: myapp/api
  imageTag: $(Build.BuildId)
  k8sNamespace: myapp-prod
  aksServiceConnection: sc-aks-prod

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Build
    jobs:
      - job: DockerBuild
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and push image
            inputs:
              command: buildAndPush
              repository: $(containerRegistry)/$(imageRepository)
              containerRegistry: sc-acr
              tags: |
                $(imageTag)
                latest

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    jobs:
      - deployment: K8sDeploy
        displayName: Deploy manifests
        environment: production/myapp-prod   # links to AKS namespace resource in ADO
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Create/update image pull secret
                - task: KubernetesManifest@1
                  displayName: Create imagePullSecret
                  inputs:
                    action: createSecret
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: $(aksServiceConnection)
                    namespace: $(k8sNamespace)
                    secretType: dockerRegistry
                    secretName: acr-pull-secret
                    dockerRegistryEndpoint: sc-acr

                # Deploy using manifest files with image substitution
                - task: KubernetesManifest@1
                  displayName: Deploy to AKS
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: $(aksServiceConnection)
                    namespace: $(k8sNamespace)
                    manifests: |
                      k8s/deployment.yml
                      k8s/service.yml
                      k8s/ingress.yml
                    containers: |
                      $(containerRegistry)/$(imageRepository):$(imageTag)
                    imagePullSecrets: acr-pull-secret

                # Wait for rollout to complete
                - task: Kubernetes@1
                  displayName: Verify rollout status
                  inputs:
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceEndpoint: $(aksServiceConnection)
                    namespace: $(k8sNamespace)
                    command: rollout
                    arguments: status deployment/myapp-api --timeout=5m

                # Check pod health
                - task: Kubernetes@1
                  displayName: Check pod status
                  inputs:
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceEndpoint: $(aksServiceConnection)
                    namespace: $(k8sNamespace)
                    command: get
                    arguments: pods -l app=myapp-api

                # Output service endpoint
                - task: Kubernetes@1
                  displayName: Get service external IP
                  inputs:
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceEndpoint: $(aksServiceConnection)
                    namespace: $(k8sNamespace)
                    command: get
                    arguments: service myapp-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
